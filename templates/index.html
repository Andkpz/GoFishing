<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка ссылки на фишинг</title>
    <link rel="icon" href="data:,">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            padding-top: 80px;
            margin: 0;
        }
        .container { width: 100%; max-width: 600px; padding: 0 20px; }
        h1 { font-size: 24px; color: #212529; margin-bottom: 20px; }
        .search-box { display: flex; flex-direction: column; gap: 10px; }
        #urlInput {
            box-sizing: border-box;
            width: 100%;
            min-height: 110px;
            padding: 12px 15px;
            font: inherit;
            font-size: 15px;
            line-height: 1.5;
            border: 1px solid #ced4da;
            border-radius: 6px;
            outline: none;
            resize: vertical;
        }
        #urlInput:focus { border-color: #0d6efd; }
        .batch-results { display: grid; gap: 12px; margin-top: 20px; }
        .batch-card { padding: 16px; border-radius: 8px; border: 1px solid; overflow-wrap: anywhere; }
        .batch-card.safe { background: #d1e7dd; color: #0f5132; border-color: #badbcc; }
        .batch-card.warn { background: #fff3cd; color: #664d03; border-color: #ffecb5; }
        .batch-card.danger { background: #f8d7da; color: #842029; border-color: #f5c2c7; }
        .batch-url { font-weight: 600; margin-bottom: 8px; }
        .batch-score { font-weight: 700; margin-bottom: 8px; }
        .batch-card ul { margin-top: 8px; }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0b5ed7; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        .loader { display: none; margin-top: 20px; color: #495057; font-size: 15px; }
        .result-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .safe { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .warn { background-color: #fff3cd; color: #664d03; border: 1px solid #ffecb5; }
        .danger { background-color: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
        .result-title { font-weight: bold; font-size: 18px; margin-bottom: 10px; word-break: break-all; }
        .score { font-weight: bold; margin-bottom: 8px; }
        .score-bar {
            height: 6px;
            background: rgba(0, 0, 0, .12);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .score-fill { height: 100%; width: 0; transition: width .3s ease; }
        .safe .score-fill { background-color: #198754; }
        .warn .score-fill { background-color: #ffc107; }
        .danger .score-fill { background-color: #dc3545; }
        ul { margin: 0; padding-left: 20px; }
        li { margin-bottom: 5px; }

        .ssl-box {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            color: #343a40;
            font-size: 14px;
        }
        .ssl-ok    { border-left: 4px solid #198754; }
        .ssl-warn  { border-left: 4px solid #ffc107; }
        .ssl-bad   { border-left: 4px solid #dc3545; }
        .ssl-muted { border-left: 4px solid #adb5bd; }
        .ssl-head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .ssl-time { margin-left: auto; font-weight: 400; font-size: 12px; color: #6c757d; white-space: nowrap; }
        .ssl-meta { margin-top: 6px; color: #495057; line-height: 1.5; word-break: break-word; }
        .ssl-notes { margin: 8px 0 0; padding-left: 18px; color: #6c757d; }
        .ssl-box details { margin-top: 8px; }
        .ssl-box summary { cursor: pointer; font-size: 13px; color: #6c757d; }
        .ssl-box code {
            display: block;
            margin-top: 6px;
            padding: 8px;
            background: #f1f3f5;
            border-radius: 4px;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .incomplete {
            display: none;
            margin-top: 12px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid #ffecb5;
            border-radius: 6px;
            color: #664d03;
            font-size: 13px;
            line-height: 1.45;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Детектор фишинговых ссылок</h1>
        <div class="search-box">
            <textarea id="urlInput" placeholder="Вставьте одну или несколько ссылок — каждую с новой строки"
                      autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                      aria-label="Ссылки для проверки"></textarea>
            <button id="checkBtn" onclick="checkURL()">Проверить ссылки</button>
            <div style="font-size:13px;color:#6c757d">Поддерживается до 100 ссылок за один запуск. Пустые строки игнорируются.</div>
        </div>

        <div id="loader" class="loader">Проверка ссылок...</div>
        <div id="batchResults" class="batch-results" aria-live="polite"></div>

        <div id="resultBox" class="result-box" aria-live="polite">
            <div class="result-title" id="resultTitle"></div>
            <div class="score" id="resultScore"></div>
            <div class="score-bar"><div class="score-fill" id="scoreFill"></div></div>
            <ul id="resultReasons"></ul>
            <div id="incompleteNote" class="incomplete"></div>
            <div id="sslBox" class="ssl-box"></div>
            <div id="whoisBox" class="ssl-box"></div>
        </div>
    </div>

    <script>
        const urlInput       = document.getElementById('urlInput');
        const checkBtn       = document.getElementById('checkBtn');
        const loader         = document.getElementById('loader');
        const resultBox      = document.getElementById('resultBox');
        const resultTitle    = document.getElementById('resultTitle');
        const resultScore    = document.getElementById('resultScore');
        const scoreFill      = document.getElementById('scoreFill');
        const resultReasons  = document.getElementById('resultReasons');
        const sslBox         = document.getElementById('sslBox');
        const whoisBox       = document.getElementById('whoisBox');
        const incompleteNote = document.getElementById('incompleteNote');
        const batchResults = document.getElementById('batchResults');

        const REQUEST_TIMEOUT_MS = 6000;   // /api/check укладывается в ~2 с
        const DOMAIN_TIMEOUT_MS  = 15000;  // /api/domain: RDAP + WHOIS до 9 с
        const PHISH_THRESHOLD    = 60;     // = phishingThreshold в main.go

        let runId = 0, baseResult = null, domainCtrl = null;
        let currentSslStatus = '', currentWhoisStatus = '';
        let isCurrentPhish = false, currentUrl = '';
        let isYoungDomain = false;

        // Статусы невалидного или неподтверждённого сертификата/домена
        const BAD_SSL_STATUSES   = new Set(['invalid', 'no_tls', 'no_dns', 'unknown', 'skipped', 'blocked']);
        const BAD_WHOIS_STATUSES = new Set(['not_found', 'unknown', 'limited', 'skipped']);

        function updateResultBoxStyle() {
            const hasWarning = BAD_SSL_STATUSES.has(currentSslStatus) ||
                               BAD_WHOIS_STATUSES.has(currentWhoisStatus) ||
                               isYoungDomain;

            if (isCurrentPhish) {
                resultBox.className = 'result-box danger';
                resultTitle.textContent = '⚠️ Обнаружен высокий риск фишинга: ' + currentUrl;
            } else if (hasWarning) {
                resultBox.className = 'result-box warn';
                resultTitle.textContent = '⚠️ Результат для: ' + currentUrl;
            } else {
                resultBox.className = 'result-box safe';
                resultTitle.textContent = '✅ Результат для: ' + currentUrl;
            }
        }

        const SSL_VIEW = {
            ok:      { icon: '🔒', cls: 'ssl-ok',    title: 'TLS-сертификат валиден' },
            invalid: { icon: '⚠️', cls: 'ssl-bad',   title: 'TLS-сертификат не прошёл проверку' },
            no_tls:  { icon: '🔓', cls: 'ssl-warn',  title: 'HTTPS недоступен: порт 443 закрыт или на нём не TLS' },
            no_dns:  { icon: '❓', cls: 'ssl-warn',  title: 'Домен не резолвится' },
            unknown: { icon: '⏱️', cls: 'ssl-muted', title: 'Сертификат проверить не удалось' },
            skipped: { icon: '⏭️', cls: 'ssl-muted', title: 'SSL-проверка не выполнялась' },
            blocked: { icon: '🛡️', cls: 'ssl-muted', title: 'SSL-проверка заблокирована: приватный адрес' }
        };
        const INCOMPLETE = new Set(['unknown', 'skipped', 'blocked']);

        const WHOIS_VIEW = {
            ok:        { icon: '📅', cls: 'ssl-ok',    title: 'Данные о домене получены' },
            not_found: { icon: '❌', cls: 'ssl-bad',   title: 'Домен не зарегистрирован' },
            limited:   { icon: '🚦', cls: 'ssl-muted', title: 'WHOIS ограничил запросы (rate limit)' },
            unknown:   { icon: '❔', cls: 'ssl-muted', title: 'Возраст домена определить не удалось' },
            skipped:   { icon: '⏭️', cls: 'ssl-muted', title: 'Проверка домена пропущена' }
        };

        urlInput.addEventListener('input', hideResult);
        urlInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                checkURL();
            }
        });

        function hideResult() {
            currentSslStatus = '';
            currentWhoisStatus = '';
            isCurrentPhish = false;
            isYoungDomain = false;
            currentUrl = '';

            resultBox.style.display = 'none';
            batchResults.replaceChildren();
            resultReasons.replaceChildren();
            sslBox.replaceChildren();
            sslBox.style.display = 'none';
            whoisBox.replaceChildren();
            whoisBox.style.display = 'none';
            incompleteNote.style.display = 'none';
            scoreFill.style.width = '0';
            baseResult = null;
            if (domainCtrl) { domainCtrl.abort(); domainCtrl = null; }
        }
        async function checkURL() {
            const urls = [...new Set(urlInput.value.split(/\r?\n/).map(value => value.trim()).filter(Boolean))];
            if (!urls.length || checkBtn.disabled) return;
            if (urls.length > 100) {
                renderError('За один запуск можно проверить не более 100 ссылок.');
                return;
            }

            const run = ++runId;
            checkBtn.disabled = true;
            hideResult();
            loader.textContent = `Проверка ссылок: 0 из ${urls.length}...`;
            loader.style.display = 'block';

            try {
                // Ограничиваем параллелизм, чтобы не перегружать локальный сервер.
                const results = new Array(urls.length);
                let nextIndex = 0;
                let completed = 0;
                const worker = async () => {
                    while (true) {
                        const index = nextIndex++;
                        if (index >= urls.length) return;
                        try {
                            const ctrl = new AbortController();
                            const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
                            try {
                                const response = await fetch('/api/check', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ url: urls[index] }),
                                    signal: ctrl.signal
                                });
                                if (!response.ok) {
                                    const message = (await response.text()).trim();
                                    throw new Error(message || `Ошибка сервера: ${response.status}`);
                                }
                                results[index] = await response.json();
                            } finally {
                                clearTimeout(timer);
                            }
                        } catch (error) {
                            results[index] = { url: urls[index], error: error.name === 'AbortError'
                                ? 'Превышено время ожидания проверки.' : error.message };
                        }
                        completed++;
                        if (run === runId) loader.textContent = `Проверка ссылок: ${completed} из ${urls.length}...`;
                    }
                };

                await Promise.all(Array.from({ length: Math.min(4, urls.length) }, worker));
                if (run !== runId) return;

                if (results.length === 1 && !results[0].error) {
                    renderResult(results[0]);
                    maybeFetchDomain(results[0], run);
                } else {
                    const batchView = renderBatchResults(results);
                    await enrichBatchResults(results, batchView, run);
                }
            } catch (error) {
                if (run === runId) renderError(error.message);
            } finally {
                if (run === runId) {
                    checkBtn.disabled = false;
                    loader.style.display = 'none';
                }
            }
        }

        function renderBatchResults(results) {
            const summary = document.createElement('div');
            summary.className = 'batch-summary';
            batchResults.appendChild(summary);

            const cards = results.map(data => {
                const card = document.createElement('section');
                card.className = 'batch-card';
                batchResults.appendChild(card);
                renderBatchCard(card, data);
                return card;
            });

            updateBatchSummary(results, summary, true);
            return { cards, summary };
        }

        function updateBatchSummary(results, summary, checkingWhois = false) {
            const failed = results.filter(item => !item || item.error).length;
            const checked = results.length - failed;
            const phishing = results.filter(item => item && !item.error && item.is_phish).length;
            const incomplete = results.filter(item => {
                if (!item || item.error || item.whois_status !== 'pending') return false;
                const status = item.domainInfo && item.domainInfo.status;
                return !status || ['unknown', 'limited', 'skipped'].includes(status) || Boolean(item.domain_check_error);
            }).length;
            summary.textContent = `Проверено: ${checked} из ${results.length} · Высокий риск: ${phishing} · Ошибок: ${failed}` +
                (checkingWhois ? ' · Уточнение возраста доменов...' : (incomplete ? ` · WHOIS не завершён: ${incomplete}` : ''));
        }

        function renderBatchCard(card, data) {
            card.replaceChildren();
            const url = document.createElement('div');
            url.className = 'batch-url';
            url.textContent = data.url || 'Неизвестная ссылка';
            card.appendChild(url);

            if (data.error) {
                card.className = 'batch-card danger';
                const error = document.createElement('div');
                error.textContent = 'Ошибка проверки: ' + data.error;
                card.appendChild(error);
                return;
            }

            const score = Math.max(0, Math.min(100, Number(data.score) || 0));
            card.className = 'batch-card ' + (data.is_phish ? 'danger' : (score > 0 ? 'warn' : 'safe'));
            const status = document.createElement('div');
            status.className = 'batch-score';
            status.textContent = `${data.is_phish ? '⚠️ Возможный фишинг' : 'Риск не превышает порог'} · ${score}/100`;
            card.appendChild(status);

            if (data.domain) {
                const domain = document.createElement('div');
                domain.textContent = 'Домен: ' + data.domain;
                card.appendChild(domain);
            }

            const reasons = [...(Array.isArray(data.reasons) ? data.reasons : [])];
            const domainInfo = data.domainInfo;
            if (domainInfo && Array.isArray(domainInfo.reasons)) reasons.push(...domainInfo.reasons);
            const items = reasons.length ? reasons : ['Подозрительных признаков не обнаружено.'];
            const list = document.createElement('ul');
            items.forEach(reason => list.appendChild(li(reason)));
            card.appendChild(list);

            if (domainInfo) {
                const whois = document.createElement('div');
                whois.style.marginTop = '8px';
                if (domainInfo.created) {
                    whois.textContent = `WHOIS/RDAP: зарегистрирован ${fmtDate(domainInfo.created)} · возраст ${formatAge(Number(domainInfo.age_days) || 0)}`;
                } else {
                    const labels = {
                        unknown: 'WHOIS/RDAP: не удалось определить возраст домена',
                        limited: 'WHOIS/RDAP: реестр ограничил запросы',
                        skipped: 'WHOIS/RDAP: проверка пропущена',
                        not_found: 'WHOIS/RDAP: домен не найден'
                    };
                    whois.textContent = labels[domainInfo.status] || 'WHOIS/RDAP: ' + (domainInfo.status || 'нет данных');
                }
                card.appendChild(whois);
                if (Array.isArray(domainInfo.notes) && domainInfo.notes.length) {
                    const notes = document.createElement('ul');
                    notes.className = 'ssl-notes';
                    domainInfo.notes.forEach(note => notes.appendChild(li(note)));
                    card.appendChild(notes);
                }
            } else if (data.domain_check_error) {
                const warning = document.createElement('div');
                warning.style.marginTop = '8px';
                warning.textContent = 'WHOIS/RDAP: дополнительная проверка не завершена — ' + data.domain_check_error;
                card.appendChild(warning);
            } else if (data.whois_status === 'pending') {
                const pending = document.createElement('div');
                pending.style.marginTop = '8px';
                pending.textContent = '⏳ Уточняется возраст домена...';
                card.appendChild(pending);
            }

            if (data.redirects && data.redirects.chain && data.redirects.chain.length > 1) {
                const redirect = document.createElement('div');
                redirect.style.marginTop = '8px';
                redirect.textContent = 'Конечный адрес после перенаправлений: ' +
                    (data.redirects.final_url || data.redirects.chain[data.redirects.chain.length - 1]);
                card.appendChild(redirect);
            }
            if (data.ssl_status) {
                const ssl = document.createElement('div');
                ssl.style.marginTop = '6px';
                ssl.textContent = 'SSL/TLS: ' + data.ssl_status;
                card.appendChild(ssl);
            }
        }

        async function enrichBatchResults(results, batchView, run) {
            let nextIndex = 0;
            const worker = async () => {
                while (true) {
                    const index = nextIndex++;
                    if (index >= results.length) return;
                    const data = results[index];
                    if (!data || data.error || !data.domain || data.whois_status !== 'pending') continue;

                    try {
                        const ctrl = new AbortController();
                        const timer = setTimeout(() => ctrl.abort(), DOMAIN_TIMEOUT_MS);
                        try {
                            const response = await fetch('/api/domain?domain=' + encodeURIComponent(data.domain), {
                                signal: ctrl.signal
                            });
                            if (!response.ok) throw new Error('HTTP ' + response.status);
                            const info = await response.json();
                            if (run !== runId) return;

                            data.domainInfo = info;
                            const baseScore = Number(data.score) || 0;
                            const domainScore = Number(info.score) || 0;
                            const totalScore = Math.max(0, Math.min(100, baseScore + domainScore));
                            data.score = totalScore;
                            data.is_phish = Boolean(data.is_phish) || totalScore >= PHISH_THRESHOLD;
                            data.reasons = [
                                ...(Array.isArray(data.reasons) ? data.reasons : []),
                                ...(Array.isArray(info.reasons) ? info.reasons : [])
                            ];
                        } finally {
                            clearTimeout(timer);
                        }
                    } catch (error) {
                        if (run !== runId) return;
                        data.domain_check_error = error.name === 'AbortError'
                            ? 'превышено время ожидания' : error.message;
                    }

                    if (run === runId) {
                        renderBatchCard(batchView.cards[index], data);
                        updateBatchSummary(results, batchView.summary, true);
                    }
                }
            };

            await Promise.all(Array.from({ length: Math.min(4, results.length) }, worker));
            if (run === runId) updateBatchSummary(results, batchView.summary, false);
        }

        function renderError(message) {
            resultBox.className = 'result-box danger';
            resultTitle.textContent = 'Ошибка проверки';
            resultScore.textContent = '';
            scoreFill.style.width = '0';
            resultReasons.replaceChildren(li(message));
            resultBox.style.display = 'block';
        }

        function renderResult(data) {
            isCurrentPhish = Boolean(data.is_phish);
            currentUrl = data.url;

            const score = Math.max(0, Math.min(100, Number(data.score) || 0));
            resultScore.textContent = `Оценка риска: ${score} / 100`;
            scoreFill.style.width = score + '%';

            const reasons = (data.reasons && data.reasons.length)
                ? data.reasons
                : ['Подозрительных признаков не обнаружено.'];
            resultReasons.replaceChildren(...reasons.map(li));

            renderSSL(data);
            updateResultBoxStyle();
            resultBox.style.display = 'block';
        }

        function renderSSL(data) {
            const ssl = data.ssl || null;
            const status = data.ssl_status || (ssl && ssl.status) || '';
            currentSslStatus = status;
            updateResultBoxStyle();

            sslBox.replaceChildren();
            incompleteNote.style.display = 'none';

            if (!status) {
                sslBox.style.display = 'none';
                return;
            }

            const view = SSL_VIEW[status] || { icon: 'ℹ️', cls: 'ssl-muted', title: 'SSL: ' + status };
            sslBox.className = 'ssl-box ' + view.cls;

            const head = document.createElement('div');
            head.className = 'ssl-head';
            const label = document.createElement('span');
            label.textContent = view.icon + ' ' + view.title;
            head.appendChild(label);
            if (ssl && ssl.elapsed_ms > 0) {
                const time = document.createElement('span');
                time.className = 'ssl-time';
                time.textContent = ssl.elapsed_ms + ' мс';
                head.appendChild(time);
            }
            sslBox.appendChild(head);

            const meta = [];
            if (ssl && ssl.issuer) meta.push('Издатель: ' + ssl.issuer);
            if (ssl && ssl.not_before) {
                meta.push('Выпущен: ' + fmtDate(ssl.not_before) +
                    (ssl.cert_age_days > 0 ? ` (${ssl.cert_age_days} дн. назад)` : ''));
            }
            if (ssl && ssl.not_after) meta.push('Действует до: ' + fmtDate(ssl.not_after));
            if (meta.length) {
                const m = document.createElement('div');
                m.className = 'ssl-meta';
                m.textContent = meta.join(' · ');
                sslBox.appendChild(m);
            }

            if (ssl && Array.isArray(ssl.notes) && ssl.notes.length) {
                const ul = document.createElement('ul');
                ul.className = 'ssl-notes';
                ssl.notes.forEach(n => ul.appendChild(li(n)));
                sslBox.appendChild(ul);
            }

            if (ssl && ssl.detail) {
                const details = document.createElement('details');
                const summary = document.createElement('summary');
                summary.textContent = 'Технические подробности';
                const code = document.createElement('code');
                code.textContent = ssl.detail;
                details.append(summary, code);
                sslBox.appendChild(details);
            }

            sslBox.style.display = 'block';

            if (INCOMPLETE.has(status)) {
                incompleteNote.textContent = 'Проверка выполнена не полностью: данные о TLS-сертификате ' +
                    'получить не удалось. Это не признак фишинга, но и не подтверждение безопасности.';
                incompleteNote.style.display = 'block';
            }
        }
        async function maybeFetchDomain(data, run) {
            if (!data.domain || data.whois_status !== 'pending') return;
            baseResult = data;

            whoisBox.className = 'ssl-box ssl-muted';
            const head = document.createElement('div');
            head.className = 'ssl-head';
            head.textContent = '⏳ Уточняем возраст домена ' + data.domain + ' (RDAP/WHOIS)...';
            whoisBox.replaceChildren(head);
            whoisBox.style.display = 'block';

            domainCtrl = new AbortController();
            const timer = setTimeout(() => domainCtrl.abort(), DOMAIN_TIMEOUT_MS);
            try {
                const resp = await fetch('/api/domain?domain=' + encodeURIComponent(data.domain),
                                       { signal: domainCtrl.signal });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const info = await resp.json();
                if (run !== runId || !baseResult) return;
                renderWhois(info);
                applyDomainScore(info);
            } catch (err) {
                if (run !== runId || !baseResult) return;
                renderWhois({ status: 'unknown',
                    detail: err.name === 'AbortError' ? 'таймаут 15 с' : err.message });
            } finally {
                clearTimeout(timer);
            }
        }

        function renderWhois(info) {
            currentWhoisStatus = info.status || '';
            isYoungDomain = (info.status === 'ok' && Boolean(info.created) && Number(info.age_days) < 3);
            updateResultBoxStyle();

            const view = WHOIS_VIEW[info.status] || WHOIS_VIEW.unknown;
            let cls = view.cls, title = view.title;
            if (info.status === 'ok' && info.created) {
                title = 'Возраст домена: ' + formatAge(info.age_days || 0);
                cls = info.score >= 25 ? 'ssl-bad' : ((info.score > 0 || isYoungDomain) ? 'ssl-warn' : 'ssl-ok');
            }
            whoisBox.className = 'ssl-box ' + cls;
            whoisBox.replaceChildren();

            const head = document.createElement('div');
            head.className = 'ssl-head';
            const label = document.createElement('span');
            label.textContent = view.icon + ' ' + title;
            head.appendChild(label);
            const timing = document.createElement('span');
            timing.className = 'ssl-time';
            timing.textContent = info.cached ? 'из кэша' : ((info.elapsed_ms || 0) + ' мс');
            head.appendChild(timing);
            whoisBox.appendChild(head);

            const meta = [];
            if (info.created) meta.push('Зарегистрирован: ' + fmtDate(info.created));
            if (info.expires) meta.push('Оплачен до: ' + fmtDate(info.expires));
            if (info.registrar) meta.push('Регистратор: ' + info.registrar);
            if (meta.length) {
                const m = document.createElement('div');
                m.className = 'ssl-meta';
                m.textContent = meta.join(' · ');
                whoisBox.appendChild(m);
            }

            if (Array.isArray(info.notes) && info.notes.length) {
                const ul = document.createElement('ul');
                ul.className = 'ssl-notes';
                info.notes.forEach(n => ul.appendChild(li(n)));
                whoisBox.appendChild(ul);
            }

            if (info.detail) {
                const details = document.createElement('details');
                const summary = document.createElement('summary');
                summary.textContent = 'Технические подробности';
                const code = document.createElement('code');
                code.textContent = info.detail;
                details.append(summary, code);
                whoisBox.appendChild(details);
            }

            whoisBox.style.display = 'block';
        }

        function applyDomainScore(info) {
            if (!baseResult) return;
            const addScore = Number(info.score) || 0;
            const extraReasons = Array.isArray(info.reasons) ? info.reasons : [];
            if (addScore === 0 && extraReasons.length === 0) return;

            const totalScore = Math.max(0, Math.min(100, (Number(baseResult.score) || 0) + addScore));
            isCurrentPhish = baseResult.is_phish || totalScore >= PHISH_THRESHOLD;
            updateResultBoxStyle();

            resultScore.textContent = `Оценка риска: ${totalScore} / 100`;
            scoreFill.style.width = totalScore + '%';

            const baseReasons = (baseResult.reasons && baseResult.reasons.length) ? baseResult.reasons : [];
            const allReasons = [...baseReasons, ...extraReasons];
            if (allReasons.length) {
                resultReasons.replaceChildren(...allReasons.map(li));
            }
        }

        function fmtDate(val) {
            const d = new Date(val);
            if (isNaN(d.getTime())) return String(val);
            return d.toLocaleDateString('ru-RU');
        }

        function formatAge(days) {
            if (days < 30) return days + ' дн.';
            if (days < 365) return Math.floor(days / 30) + ' мес.';
            const years = Math.floor(days / 365);
            const remDays = days % 365;
            return years + ' г.' + (remDays >= 30 ? ' ' + Math.floor(remDays / 30) + ' мес.' : '');
        }

        function li(text) {
            const item = document.createElement('li');
            item.textContent = text;
            return item;
        }
    </script>


</body>
</html>
